<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
a { text-decoration: none; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F6F3; display: flex; flex-direction: column;">

  <!-- Encabezado de marca -->
  <div style="background: #141414; padding: 68px 28px 52px; color: #fff; border-bottom: 5px solid #FFD100;">
    <span style="display: inline-flex; align-items: center; justify-content: center; background: #FFD100; color: #E2231A; font-weight: 800; font-size: 20px; letter-spacing: -0.03em; padding: 6px 16px; border-radius: 10px; border: 2.5px solid #141414; box-shadow: 0 0 0 2px #FFD100;">TCC</span>
    <h1 style="margin: 26px 0 8px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em;">Torre de Control</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #BFBFB8;">Alertas de entregas y novedades en tiempo real.</p>
  </div>

  <!-- Formulario -->
  <div style="flex: 1; padding: 36px 28px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="email" style="font-size: 13px; font-weight: 600; color: #333330;">Correo electrónico</label>
      <input id="email" type="email" placeholder="controlador@tcc.com.co" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D6D3CC; border-radius: 12px; font-size: 15px; color: #1A1A1A; background: #fff;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="pass" style="font-size: 13px; font-weight: 600; color: #333330;">Contraseña</label>
      <input id="pass" type="password" placeholder="••••••••" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D6D3CC; border-radius: 12px; font-size: 15px; color: #1A1A1A; background: #fff;">
    </div>

    <a href="Dashboard.dc.html" style="margin-top: 4px; height: 54px; display: flex; align-items: center; justify-content: center; background: #D81E05; color: #fff; font-size: 16px; font-weight: 700; border-radius: 12px;">
      Iniciar sesión
    </a>

    <button type="button" style="background: none; border: none; color: #B91C13; font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px;">
      ¿Olvidaste tu contraseña?
    </button>

    <div style="margin-top: auto; display: flex; align-items: flex-start; gap: 10px; background: #FFF8DD; border: 1px solid #F2E4A8; border-radius: 12px; padding: 14px 16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Información" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #4A4A45;">Acceso restringido a personal autorizado de la torre de control. Las acciones quedan registradas.</p>
    </div>
  </div>

</div>
</x-dc>
