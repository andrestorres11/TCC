      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 14.5px; font-weight: 600; color: #1A1A1A;">Juan Peña</div>

      <span style="background: #E7F4EC; color: #15803D; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;">CONDUCTOR</span>
    </div>

    <!-- Asignación destacada -->
    <h2 style="margin: 24px 0 10px; font-size: 15px; font-weight: 700; color: #1A1A1A;">Asignación conductor ↔ vehículo</h2>
    <div style="background: #fff; border: 1px solid #E6E3DC; border-radius: 14px; padding: 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div style="font-size: 14.5px; font-weight: 700; color: #1A1A1A;">Andrés Melo</div>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A958A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        <div style="text-align: right;">
          <div style="font-size: 14.5px; font-weight: 700; color: #1A1A1A;">WGK-412</div>
